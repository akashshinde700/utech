name: CI

on:
  push:
    branches: [main]
  pull_request:

# The suites must pass before anything ships — until now nothing ran them
# automatically on push (AUD-119), so a green local run was the only gate.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The suites above run against the in-memory Prisma adapter, which is fast but
  # cannot see anything MySQL-specific. The drift this job guards against was
  # real: the hand-written init migration created five foreign keys with the
  # wrong ON DELETE rule and left two out entirely, so the database built by
  # `prisma migrate deploy` did not match schema.prisma -- and nothing noticed
  # for 43 migrations. `migrate diff --exit-code` makes that impossible to
  # reintroduce.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: utech_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/utech_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Replay every migration from an empty database
        run: npx prisma migrate deploy
      - name: The result must match schema.prisma exactly
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed, then re-derive every cached total
        run: |
          npm run prisma:seed
          npm run db:check-integrity

  # The end-to-end suite runs the real app in a real browser against the
  # in-memory demo stack. It is the only check that sees what a phone sees, and
  # it has already caught a bug the unit suites could not: list endpoints with
  # no tiebreaker put a just-saved record on page 2.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # --with-deps for the system libraries; the suite itself launches the
      # @sparticuz/chromium build that playwright.config.js resolves when
      # E2E_CHROME_PATH is unset (it is set only on a developer machine).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
